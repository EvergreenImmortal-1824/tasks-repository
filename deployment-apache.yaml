apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-app
  namespace: webapp
  labels:
    app: apache-app
spec:
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: apache-app
        image:  httpd:latest
        resources:
          requests:
            cpu: 200m
            memory: 150Mi
          limits:
            cpu: 100m
            memory: 100Mi
        ports:
        - containerPort: 80

---

  apiVersion: v1
  kind: Service
  metadata:
    name: apache-app-service
    namespace: webapp
  spec:
    selector:
      app: webapp
    ports:
    - port: 8888
      targetPort: 80
    type: NodePort