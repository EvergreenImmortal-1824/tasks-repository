apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  labels:
    app: nginx-app
spec:
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: nginx-app
        image:  nginx:latest
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 150Mi
        ports:
        - containerPort: 80

---

  apiVersion: v1
  kind: Service
  metadata:
    name: nginx-app-service
  spec:
    selector:
      app: webapp
    ports:
    - port: 8001
      targetPort: 80
    type: NodePort