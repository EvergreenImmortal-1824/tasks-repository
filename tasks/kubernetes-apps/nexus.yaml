apiVersion: v1
kind: Namespace
metadata:
  name: nexus

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name:  nexus-app
  namespace: nexus
  labels:
    app:  nexus
spec:
  selector:
    matchLabels:
      app: nexus
  replicas: 1
  template:
    metadata:
      labels:
        app:  nexus
    spec:
      containers:
      - name:  nexus-app
        image:  sonatype/nexus3:latest
        resources:
          requests:
            cpu: "1"
            memory: "1500Mi"
          limits:
            cpu: "2"
            memory: "3Gi"
        ports:
        - containerPort: 8081
          name:  nexus-port

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-service
  namespace: nexus
spec:
  selector:
    app: nexus
  type: NodePort
  ports:
  - name: nexus
    port: 8081
    targetPort: 8081