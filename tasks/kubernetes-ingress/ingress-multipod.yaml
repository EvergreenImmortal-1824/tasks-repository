apiVersion: v1
kind: Pod
metadata:
  name: myapp1
  namespace: webapp
  labels:
    app: myapp1-la
spec:
  containers:
  - name: myapp1
    image: nginx:latest
    resources:
      limits:
        cpu: "500m"
        memory: "128Mi"
    ports:
    - containerPort:  80
---
apiVersion: v1
kind: Pod
metadata:
  name: myapp2
  namespace: webapp
  labels:
    app: myapp2-la
spec:
  containers:
  - name: myapp2
    image: httpd:latest
    resources:
      limits:
        cpu: "500m"
        memory: "128Mi"
    ports:
    - containerPort:  80

---

apiVersion: v1
kind: Service
metadata:
  name: myapp1-svc
  namespace: webapp
spec:
  selector:
    app: myapp1-la
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: myapp2-svc
  namespace: webapp
spec:
  selector:
    app: myapp2-la
  ports:
  - port: 80
    targetPort: 80

---

# https://kubernetes.io/docs/concepts/services-networking/ingress/#the-ingress-resource

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  namespace: webapp
  annotations: 
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /myapp1
        pathType: Prefix
        backend:
          service:
            name: myapp1-svc
            port:
              number: 80
  - http:
      paths:
      - path: /myapp2
        pathType: Prefix
        backend:
          service:
            name: myapp2-svc
            port:
              number: 80