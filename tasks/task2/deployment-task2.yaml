apiVersion: apps/v1
kind: Deployment
metadata:
  name: task2
labels:
    app: task2-app
spec:
  selector:
    matchLabels:
      app: task2-webapp
  template:
    metadata:
      labels:
        app: task2-webapp
    spec:
      containers:
      - name: task2-container
        image: jenishchhowala/tasks-repository:task2-v1
        resources:
          requests:
            memory: "100Mi"
            cpu: "250m"
          limits:
            memory: "300Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: task2-app-service
spec:
  selector:
    app: task2-app
  ports:
  - port: 8001
    targetPort: 80
    type: NodePort
