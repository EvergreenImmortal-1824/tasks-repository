apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin-deployment
  namespace: database
labels:
    app: phpmyadmin
spec:
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin-container
        image: phpmyadmin:latest
        resources:
          requests:
            memory: "400Mi"
            cpu: "500m"
          limits:
            memory: "600Mi"
            cpu: "700m"
        ports:
        - containerPort: 80
        env:
        - name: PMA_HOST
          value: mysql-svc.database.svc.cluster.local
        - name: PMA_PORT
          value: "3306"