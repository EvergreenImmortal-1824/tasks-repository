apiVersion: v1
kind: Namespace
metadata:
  name: autotest
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: testpvc
  namespace: autotest
  labels:
    app: myapp
spec:
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
---
apiVersion: v1
kind: Pod
metadata:
  name: myapp
  namespace: autotest
  labels:
    app: myapp
spec:
  containers:
    - name: myapp-pod
      image: ubuntu:latest
      command:
        - sleep
        - "3600"
      # --- FIXES APPLIED HERE ---
      tty: true                   # Keeps the background Ubuntu container terminal stream open
      resources:
        limits:
          memory: "256Mi"         # Increased from 128Mi to prevent immediate OOM termination
          cpu: "500m"
        requests:
          memory: "128Mi"
          cpu: "250m"
      # --------------------------
      volumeMounts:
        - name: data-mount
          mountPath: /opt
  volumes:
    - name: data-mount
      persistentVolumeClaim:
        claimName: testpvc
