apiVersion: apps/v1
kind: Deployment
metadata:
  name: task1
spec:
  selector:
    matchLabels:
      app: task1-webapp
  template:
    metadata:
      labels:
        app: task1-webapp
    spec:
      containers:
      - name: task1-container
        image: jenishchhowala/tasks-repository:task1-v1
        resources:
          requests:
            memory: "100Mi"
            cpu: "250m"
          limits:
            memory: "300Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: task1-app-service
spec:
  selector:
    app: task1-webapp
  ports:
  - port: 8000
    targetPort: 80
    type: NodePort
