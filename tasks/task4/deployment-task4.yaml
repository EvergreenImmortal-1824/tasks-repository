apiVersion: apps/v1
kind: Deployment
metadata:
  name: task4
spec:
  selector:
    matchLabels:
      app: task4-webapp
  template:
    metadata:
      labels:
        app: task4-webapp
    spec:
      containers:
      - name: task4-container
        image: jenishchhowala/tasks-repository:task4-v1
        resources:
          requests:
            memory: "100Mi"
            cpu: "250m"
          limits:
            memory: "300Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: task4-app-service
spec:
  selector:
    app: task4-webapp
  ports:
  - port: 8004
    targetPort: 80
  type: NodePort
